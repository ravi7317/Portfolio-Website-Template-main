<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#140f26"/>
      <stop offset="100%" stop-color="#0a0514"/>
    </linearGradient>
    
    <!-- Login Card Glassmorphism -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing button -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e2de2"/>
      <stop offset="100%" stop-color="#4a00e0"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neon-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="15" fill="url(#bg-grad)" />
  
  <!-- Light flares -->
  <circle cx="280" cy="120" r="160" fill="#8e2de2" opacity="0.15" filter="url(#neon-purple)" />
  <circle cx="550" cy="380" r="140" fill="#4a00e0" opacity="0.12" filter="url(#neon-purple)" />

  <!-- App Window Border -->
  <rect x="40" y="30" width="720" height="440" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- Center Login Card -->
  <rect x="250" y="70" width="300" height="360" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  
  <text x="400" y="120" fill="#ffffff" font-family="Poppins, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Welcome Back</text>
  <text x="400" y="142" fill="#ffffff" fill-opacity="0.5" font-family="Poppins, sans-serif" font-size="12" text-anchor="middle">Enter your credentials to access account</text>

  <!-- Username Input Field -->
  <g transform="translate(280, 175)">
    <text x="0" y="-8" fill="#ffffff" fill-opacity="0.6" font-family="Poppins, sans-serif" font-size="11" font-weight="500">EMAIL ADDRESS</text>
    <rect width="240" height="40" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="15" y="25" fill="#ffffff" font-family="Poppins, sans-serif" font-size="13">ravi@developer.com</text>
    <!-- Checkmark Validation Icon -->
    <circle cx="220" cy="20" r="8" fill="#00e676" />
    <path d="M217 20 L219 22 L223 18" fill="none" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- Password Input Field -->
  <g transform="translate(280, 245)">
    <text x="0" y="-8" fill="#ffffff" fill-opacity="0.6" font-family="Poppins, sans-serif" font-size="11" font-weight="500">PASSWORD</text>
    <rect width="240" height="40" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <!-- Password bullet dots -->
    <circle cx="20" cy="20" r="4" fill="#ffffff" />
    <circle cx="32" cy="20" r="4" fill="#ffffff" />
    <circle cx="44" cy="20" r="4" fill="#ffffff" />
    <circle cx="56" cy="20" r="4" fill="#ffffff" />
    <circle cx="68" cy="20" r="4" fill="#ffffff" />
    <circle cx="80" cy="20" r="4" fill="#ffffff" />
    <!-- Password eye icon (visible) -->
    <path d="M210 20 C210 20 215 14 220 14 C225 14 230 20 230 20 C230 20 225 26 220 26 C215 26 210 20 210 20 Z" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="220" cy="20" r="3" fill="#ffffff" fill-opacity="0.8" />
  </g>

  <!-- Remember Me & Forgot Password -->
  <g transform="translate(280, 312)">
    <!-- Checkbox checked -->
    <rect width="14" height="14" rx="3" fill="#8e2de2" />
    <path d="M3 7 L6 10 L11 4" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <text x="22" y="12" fill="#ffffff" fill-opacity="0.6" font-family="Poppins, sans-serif" font-size="11">Remember me</text>
    
    <text x="240" y="12" fill="#8e2de2" font-family="Poppins, sans-serif" font-size="11" font-weight="600" text-anchor="end">Forgot Password?</text>
  </g>

  <!-- Login Submit Button -->
  <g transform="translate(280, 350)">
    <rect width="240" height="42" rx="21" fill="url(#btn-grad)" filter="url(#neon-purple)" />
    <text x="120" y="26" fill="#ffffff" font-family="Poppins, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Log In</text>
  </g>

  <!-- Bottom Register Link -->
  <text x="400" y="415" fill="#ffffff" fill-opacity="0.5" font-family="Poppins, sans-serif" font-size="12" text-anchor="middle">Don't have an account? <tspan fill="#8e2de2" font-weight="600">Register</tspan></text>
</svg>
