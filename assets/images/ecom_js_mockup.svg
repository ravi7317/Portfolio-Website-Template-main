<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1111"/>
      <stop offset="100%" stop-color="#070808"/>
    </linearGradient>
    
    <!-- Card Glassmorphism -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="cart-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="15" fill="url(#bg-grad)" />

  <!-- App Window Border -->
  <rect x="40" y="30" width="720" height="440" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Navigation Bar -->
  <line x1="40" y1="80" x2="760" y2="80" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
  
  <text x="60" y="60" fill="#ffffff" font-family="Poppins, sans-serif" font-size="18" font-weight="700">JS<tspan fill="#ffbd39">Store</tspan></text>
  
  <!-- Search input -->
  <rect x="220" y="44" width="220" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="240" y="62" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="11">Search products...</text>
  
  <!-- Categories navigation -->
  <g transform="translate(470, 48)">
    <text x="0" y="14" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="12" font-weight="600">All</text>
    <text x="40" y="14" fill="#ffffff" fill-opacity="0.6" font-family="Poppins, sans-serif" font-size="12">Electronics</text>
    <text x="130" y="14" fill="#ffffff" fill-opacity="0.6" font-family="Poppins, sans-serif" font-size="12">Fashion</text>
  </g>

  <!-- Shopping Cart Icon in Header -->
  <g transform="translate(710, 44)">
    <path d="M0 2 L5 2 L9 14 L22 14 L25 5 L7 5" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="11" cy="18" r="2.5" fill="#ffffff" />
    <circle cx="20" cy="18" r="2.5" fill="#ffffff" />
    <circle cx="24" cy="2" r="7.5" fill="#ffbd39" />
    <text x="24" y="6" fill="#000000" font-family="Poppins, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
  </g>

  <!-- Products Grid (3 items shown) -->
  
  <!-- Product 1: Wireless Headphones -->
  <g transform="translate(60, 105)">
    <rect width="210" height="340" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06" />
    <rect x="15" y="15" width="180" height="180" rx="8" fill="#ffffff" fill-opacity="0.04" />
    
    <!-- Headphone Vector Illustration -->
    <path d="M75 125 A 30 30 0 0 1 135 125" fill="none" stroke="#ffbd39" stroke-width="6" stroke-linecap="round"/>
    <rect x="70" y="120" width="12" height="25" rx="3" fill="#ffbd39" />
    <rect x="128" y="120" width="12" height="25" rx="3" fill="#ffbd39" />
    <line x1="76" y1="125" x2="76" y2="140" stroke="#ffffff" stroke-width="2" />
    <line x1="134" y1="125" x2="134" y2="140" stroke="#ffffff" stroke-width="2" />

    <text x="15" y="225" fill="#ffffff" font-family="Poppins, sans-serif" font-size="14" font-weight="600">SonicHead Pro</text>
    <text x="15" y="245" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="11">High fidelity audio</text>
    <text x="15" y="280" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="18" font-weight="700">$99.99</text>
    
    <!-- Stars -->
    <text x="145" y="280" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="12">★★★★☆</text>
    
    <!-- Button -->
    <rect x="15" y="298" width="180" height="30" rx="6" fill="#ffbd39" />
    <text x="105" y="318" fill="#000000" font-family="Poppins, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Product 2: Smartwatch -->
  <g transform="translate(295, 105)">
    <rect width="210" height="340" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06" />
    <rect x="15" y="15" width="180" height="180" rx="8" fill="#ffffff" fill-opacity="0.04" />
    
    <!-- Smartwatch Illustration -->
    <rect x="90" y="60" width="30" height="90" rx="5" fill="#555555" />
    <rect x="80" y="80" width="50" height="50" rx="10" fill="#222222" stroke="#ffbd39" stroke-width="2" />
    <circle cx="105" cy="105" r="18" fill="#111111" />
    <path d="M105 105 L115 105 M105 105 L105 95" stroke="#ffbd39" stroke-width="1.5" stroke-linecap="round" />

    <text x="15" y="225" fill="#ffffff" font-family="Poppins, sans-serif" font-size="14" font-weight="600">Chronos Watch</text>
    <text x="15" y="245" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="11">AMOLED Display</text>
    <text x="15" y="280" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="18" font-weight="700">$149.50</text>
    <text x="145" y="280" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="12">★★★★★</text>
    
    <rect x="15" y="298" width="180" height="30" rx="6" fill="#ffbd39" />
    <text x="105" y="318" fill="#000000" font-family="Poppins, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Product 3: Sneakers -->
  <g transform="translate(530, 105)">
    <rect width="210" height="340" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06" />
    <rect x="15" y="15" width="180" height="180" rx="8" fill="#ffffff" fill-opacity="0.04" />
    
    <!-- Sneaker Illustration -->
    <path d="M60 125 L90 100 L150 100 L160 120 L150 140 L70 140 Z" fill="#ffbd39" opacity="0.8" />
    <path d="M70 140 L150 140 L160 135 L60 135 Z" fill="#ffffff" />
    <line x1="90" y1="100" x2="105" y2="120" stroke="#000000" stroke-width="2" />
    <line x1="100" y1="100" x2="115" y2="120" stroke="#000000" stroke-width="2" />

    <text x="15" y="225" fill="#ffffff" font-family="Poppins, sans-serif" font-size="14" font-weight="600">Aero Sneakers</text>
    <text x="15" y="245" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="11">Lightweight comfort</text>
    <text x="15" y="280" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="18" font-weight="700">$79.99</text>
    <text x="145" y="280" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="12">★★★★☆</text>
    
    <rect x="15" y="298" width="180" height="30" rx="6" fill="#ffbd39" />
    <text x="105" y="318" fill="#000000" font-family="Poppins, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Add to Cart</text>
  </g>
</svg>
