<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>
    
    <!-- Card Glassmorphism -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="15" fill="url(#bg-grad)" />

  <!-- App Window Border -->
  <rect x="40" y="30" width="720" height="440" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
  
  <!-- Window title -->
  <text x="400" y="65" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">CHRONOS - AGE CALCULATOR</text>

  <!-- Left Side: Input Panel -->
  <rect x="80" y="110" width="280" height="310" rx="16" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05" />
  
  <text x="110" y="150" fill="#ffffff" font-family="Poppins, sans-serif" font-size="16" font-weight="600">Select Date of Birth</text>
  
  <!-- Calendar Input Field -->
  <g transform="translate(110, 180)">
    <rect width="220" height="45" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffbd39" stroke-opacity="0.8" stroke-width="1.5" />
    <text x="15" y="27" fill="#ffffff" font-family="Poppins, sans-serif" font-size="14">October 28, 2000</text>
    <!-- Calendar Icon -->
    <rect x="185" y="12" width="20" height="20" rx="4" fill="none" stroke="#ffbd39" stroke-width="1.5" />
    <line x1="185" y1="18" x2="205" y2="18" stroke="#ffbd39" stroke-width="1.5" />
    <circle cx="190" cy="24" r="1.5" fill="#ffbd39" />
    <circle cx="195" cy="24" r="1.5" fill="#ffbd39" />
    <circle cx="200" cy="24" r="1.5" fill="#ffbd39" />
  </g>

  <!-- Calculate Button -->
  <g transform="translate(110, 250)">
    <rect width="220" height="45" rx="22" fill="#ffbd39" filter="url(#neon-glow)" />
    <text x="110" y="27" fill="#06080e" font-family="Poppins, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Calculate Age</text>
  </g>

  <!-- Subtitle Details -->
  <text x="220" y="340" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="12" text-anchor="middle">Calculates precisely down to the second.</text>
  
  <!-- Right Side: Metrics Dashboard -->
  <rect x="390" y="110" width="330" height="310" rx="16" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05" />

  <text x="420" y="150" fill="#ffffff" font-family="Poppins, sans-serif" font-size="16" font-weight="600">Chronological Age</text>

  <!-- Big Number Visuals -->
  <g transform="translate(420, 180)">
    <!-- Years -->
    <rect width="80" height="70" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="40" y="35" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="24" font-weight="700" text-anchor="middle">25</text>
    <text x="40" y="55" fill="#ffffff" fill-opacity="0.5" font-family="Poppins, sans-serif" font-size="11" text-anchor="middle">Years</text>
    
    <!-- Months -->
    <rect x="95" y="0" width="80" height="70" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="135" y="35" fill="#ffffff" font-family="Poppins, sans-serif" font-size="24" font-weight="700" text-anchor="middle">7</text>
    <text x="135" y="55" fill="#ffffff" fill-opacity="0.5" font-family="Poppins, sans-serif" font-size="11" text-anchor="middle">Months</text>

    <!-- Days -->
    <rect x="190" y="0" width="80" height="70" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="230" y="35" fill="#ffffff" font-family="Poppins, sans-serif" font-size="24" font-weight="700" text-anchor="middle">5</text>
    <text x="230" y="55" fill="#ffffff" fill-opacity="0.5" font-family="Poppins, sans-serif" font-size="11" text-anchor="middle">Days</text>
  </g>

  <!-- Micro counters (Hours, Min, Sec) -->
  <g transform="translate(420, 270)">
    <!-- Hours -->
    <rect width="80" height="50" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05" />
    <text x="40" y="25" fill="#ffffff" fill-opacity="0.9" font-family="Poppins, sans-serif" font-size="16" font-weight="600" text-anchor="middle">14</text>
    <text x="40" y="40" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="9" text-anchor="middle">Hours</text>

    <!-- Minutes -->
    <rect x="95" y="0" width="80" height="50" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05" />
    <text x="135" y="25" fill="#ffffff" fill-opacity="0.9" font-family="Poppins, sans-serif" font-size="16" font-weight="600" text-anchor="middle">32</text>
    <text x="135" y="40" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="9" text-anchor="middle">Minutes</text>

    <!-- Seconds (pulsing green highlight) -->
    <rect x="190" y="0" width="80" height="50" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#00e676" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="230" y="25" fill="#00e676" font-family="Poppins, sans-serif" font-size="16" font-weight="600" text-anchor="middle" filter="url(#neon-glow)">48</text>
    <text x="230" y="40" fill="#00e676" fill-opacity="0.7" font-family="Poppins, sans-serif" font-size="9" text-anchor="middle">Seconds</text>
  </g>
  
  <!-- Next Birthday Indicator -->
  <line x1="420" y1="350" x2="690" y2="350" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="420" y="380" fill="#ffffff" fill-opacity="0.5" font-family="Poppins, sans-serif" font-size="13">NEXT BIRTHDAY IN:</text>
  <text x="690" y="380" fill="#ffbd39" font-family="Poppins, sans-serif" font-size="14" font-weight="600" text-anchor="end">4 Months, 25 Days</text>
</svg>
