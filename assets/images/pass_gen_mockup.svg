<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1214"/>
      <stop offset="100%" stop-color="#05090a"/>
    </linearGradient>
    
    <!-- Card Glassmorphism -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    
    <!-- Neon green glow -->
    <filter id="neon-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="15" fill="url(#bg-grad)" />

  <!-- App Window Border -->
  <rect x="40" y="30" width="720" height="440" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
  
  <!-- Title -->
  <text x="400" y="70" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">PASSGUARD - PASSWORD GENERATOR</text>

  <!-- Main Card Container -->
  <rect x="180" y="100" width="440" height="330" rx="16" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Output Box (Generated Password Display) -->
  <g transform="translate(210, 130)">
    <rect width="380" height="50" rx="8" fill="#121b1d" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="32" fill="#00e676" font-family="monospace" font-size="20" font-weight="600" letter-spacing="1.5">k9$vP!2xQw9Lp@z</text>
    
    <!-- Copy to Clipboard Button -->
    <g transform="translate(335, 10)">
      <rect width="30" height="30" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
      <!-- Copy Icon -->
      <rect x="8" y="11" width="10" height="12" rx="2" fill="none" stroke="#00e676" stroke-width="1.5" />
      <rect x="12" y="7" width="10" height="12" rx="2" fill="none" stroke="#00e676" stroke-width="1.5" fill="#121b1d" />
    </g>
  </g>

  <!-- Password Strength Meter -->
  <g transform="translate(210, 195)">
    <rect width="380" height="8" rx="4" fill="#ffffff" fill-opacity="0.05" />
    <!-- Glowing green strength indicator -->
    <rect width="300" height="8" rx="4" fill="#00e676" filter="url(#neon-green)" />
    <text x="0" y="28" fill="#ffffff" fill-opacity="0.4" font-family="Poppins, sans-serif" font-size="11">PASSWORD STRENGTH:</text>
    <text x="380" y="28" fill="#00e676" font-family="Poppins, sans-serif" font-size="12" font-weight="700" text-anchor="end">STRONG (ULTIMATE)</text>
  </g>

  <!-- Control: Length Slider -->
  <g transform="translate(210, 245)">
    <text x="0" y="15" fill="#ffffff" fill-opacity="0.8" font-family="Poppins, sans-serif" font-size="13" font-weight="500">Character Length</text>
    <text x="380" y="15" fill="#00e676" font-family="Poppins, sans-serif" font-size="18" font-weight="700" text-anchor="end">16</text>
    
    <!-- Slider track -->
    <rect y="30" width="380" height="6" rx="3" fill="#ffffff" fill-opacity="0.1" />
    <!-- Slider filled track -->
    <rect y="30" width="190" height="6" rx="3" fill="#00e676" />
    <!-- Slider thumb -->
    <circle cx="190" cy="33" r="10" fill="#ffffff" stroke="#00e676" stroke-width="3" filter="url(#neon-green)" />
  </g>

  <!-- Checkbox Options Grid -->
  <g transform="translate(210, 315)">
    <!-- Checkbox 1: Uppercase -->
    <g transform="translate(0, 0)">
      <rect width="16" height="16" rx="4" fill="#00e676" />
      <path d="M4 8 L7 11 L12 5" fill="none" stroke="#05090a" stroke-width="2" />
      <text x="26" y="13" fill="#ffffff" fill-opacity="0.8" font-family="Poppins, sans-serif" font-size="12">Uppercase Letters</text>
    </g>

    <!-- Checkbox 2: Lowercase -->
    <g transform="translate(200, 0)">
      <rect width="16" height="16" rx="4" fill="#00e676" />
      <path d="M4 8 L7 11 L12 5" fill="none" stroke="#05090a" stroke-width="2" />
      <text x="26" y="13" fill="#ffffff" fill-opacity="0.8" font-family="Poppins, sans-serif" font-size="12">Lowercase Letters</text>
    </g>

    <!-- Checkbox 3: Numbers -->
    <g transform="translate(0, 35)">
      <rect width="16" height="16" rx="4" fill="#00e676" />
      <path d="M4 8 L7 11 L12 5" fill="none" stroke="#05090a" stroke-width="2" />
      <text x="26" y="13" fill="#ffffff" fill-opacity="0.8" font-family="Poppins, sans-serif" font-size="12">Include Numbers</text>
    </g>

    <!-- Checkbox 4: Symbols -->
    <g transform="translate(200, 35)">
      <rect width="16" height="16" rx="4" fill="#00e676" />
      <path d="M4 8 L7 11 L12 5" fill="none" stroke="#05090a" stroke-width="2" />
      <text x="26" y="13" fill="#ffffff" fill-opacity="0.8" font-family="Poppins, sans-serif" font-size="12">Include Symbols</text>
    </g>
  </g>
</svg>
